# On-demand multi-ref Wine build, for pulling several builds at once (e.g.
# shibco's latest release plus one or more of this fork's own branches)
# without compiling any of them locally. Companion to ci-build.yml (which
# always builds just this branch on every push); this one only runs when
# you trigger it, against whatever refs you ask for.
#
# Trigger from the Actions tab ("Run workflow") or:
#
#   gh workflow run ci-build-matrix.yml --repo <owner>/ableton-linux \
#       -f refs="shibco-latest,wine-11.13-color-theming"
#
# `refs` is a comma-separated list. Each entry is either:
#   - shibco-latest   shibco/ableton-linux's newest v* release tag,
#                     resolved at run time via the GitHub API
#   - shibco-main     shibco/ableton-linux's main branch HEAD
#   - anything else   a branch or tag name in THIS fork
#
# Each ref becomes its own matrix job (fail-fast: false, so one broken ref
# doesn't cancel the others) and its own artifact, named wine-build-<ref>
# with slashes turned into dashes. Pull one with:
#
#   gh run download <run-id> --repo <owner>/ableton-linux --name wine-build-<ref>
#
# ccache only actually speeds anything up for refs that already carry this
# fork's ccache-enabled Containerfile/build.sh (branches built on top of
# ci-build-wine) - build.sh and the Containerfile both come from whichever
# ref is checked out, not from this workflow's own branch. Other refs
# (shibco's, or this fork's non-ccache branches) just do a normal full
# build; the ccache-stats step is non-fatal so that's not a failure.
name: ci-build-matrix

on:
  workflow_dispatch:
    inputs:
      refs:
        description: 'Comma-separated refs to build (e.g. shibco-latest,wine-11.13-color-theming)'
        required: true
        default: 'shibco-latest'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve each ref to a (repo, ref, artifact label) triple
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REFS_INPUT: ${{ inputs.refs }}
        run: |
          set -euo pipefail
          entries="[]"
          IFS=',' read -ra items <<< "$REFS_INPUT"
          for raw in "${items[@]}"; do
              item="$(echo "$raw" | xargs)"   # trim whitespace
              [ -n "$item" ] || continue
              case "$item" in
                  shibco-latest)
                      tag="$(gh api repos/shibco/ableton-linux/releases/latest --jq .tag_name)"
                      repo="shibco/ableton-linux"; ref="$tag"; label="shibco-latest-$tag" ;;
                  shibco-main)
                      repo="shibco/ableton-linux"; ref="main"; label="shibco-main" ;;
                  *)
                      repo="${{ github.repository }}"; ref="$item"; label="$item" ;;
              esac
              label="$(echo "$label" | tr '/' '-')"
              entry="$(jq -nc --arg repo "$repo" --arg ref "$ref" --arg label "$label" \
                  '{repo: $repo, ref: $ref, label: $label}')"
              entries="$(echo "$entries" | jq -c ". + [$entry]")"
          done
          echo "Resolved refs:"
          echo "$entries" | jq .
          echo "matrix=$entries" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.entry.repo }}
          ref: ${{ matrix.entry.ref }}

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.entry.label }}-${{ hashFiles('patches/**', 'Containerfile') }}
          restore-keys: |
            ccache-${{ matrix.entry.label }}-

      # GitHub-hosted runners have Docker preinstalled, not podman. build.sh
      # and the Containerfile are whatever this specific ref carries - only
      # ci-build-wine-descended branches have the ccache plumbing at all.
      - name: Build Wine + PipeASIO
        run: ENGINE=docker JOBS="$(nproc)" ./build.sh

      - name: Fix ownership of container output (docker runs as root here)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" dist .ccache 2>/dev/null || true

      - name: ccache stats
        if: always()
        continue-on-error: true
        run: docker run --rm -v "$PWD/.ccache:/ccache" -e CCACHE_DIR=/ccache ableton-wine-build:22.04 ccache -s

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wine-build-${{ matrix.entry.label }}
          path: |
            dist/wine-d2d1-nspa-*.tar.zst
            dist/wine-d2d1-nspa-*.tar.zst.sha256
            dist/BUILD-INFO*.txt
          if-no-files-found: error
          retention-days: 14
