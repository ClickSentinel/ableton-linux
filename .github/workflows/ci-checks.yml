# Fast checks: shell unit tests, repo invariants, kit completeness, and a full
# patch-stack apply against the vendored Wine base.
#
# Deliberately NOT path-filtered, unlike ci-pr-build.yml. Every check here is
# cheap enough to run on everything, and the failures they catch (a stale
# patch, an unstaged kit file, a version literal left behind by a rename) are
# introduced by commits that touch none of the paths that workflow watches.
#
# Nothing here compiles Wine. This does not replace ci-pr-build.yml — it fails
# in the first minute of a PR for the mistakes that otherwise surface in its
# fortieth, or after release.
name: ci-checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install check tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
              bats shellcheck desktop-file-utils libxml2-utils zstd dash busybox

      # Split into steps rather than one `tests/run.sh` so a red build names the
      # tier that broke without anyone opening the log.
      - name: Repo invariants (lint, versions, desktop integration)
        run: bats --print-output-on-failure tests/repo-hygiene.bats

      - name: Kit completeness (does the installer carry what it runs?)
        run: bats --print-output-on-failure tests/packaging.bats

      - name: Launcher contract (which Live starts, and how documents route)
        run: bats --print-output-on-failure tests/launcher-cli.bats

      - name: Shell unit tests
        run: bats --recursive --print-output-on-failure tests/unit

      - name: Patch stack applies to the pinned Wine base
        run: bats --print-output-on-failure tests/patch-stack.bats
